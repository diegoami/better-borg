# Typecheck, test, and prove the committed plugin.js is current.
#
# This mod is tested by booting a REAL game: its hooks run against levels
# generated from Angband 4.2.6 gamedata, because a staircase-reachability fix
# proven against a hand-built cave is a fix proven against a fixture. That
# gamedata used to require a sparse checkout of the game's repository, because
# @rpgm-tools/neo-angband-content was not published. It is, from 0.12.0, and it
# exports the pack - so the checkout, the NEO_ANGBAND_REPO variable and the
# guard that the pack had actually landed are all gone. This workflow now
# proves the mod against exactly what a third-party author would install.
#
# Mandos (#46): this repo had not taken that dependency, so CI skipped the
# whole play harness. It is a devDependency now, and with CI set (GitHub sets
# it) a missing pack or an unplayable engine FAILS the play suite.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check CI classification and trigger controls
        run: node --test .github/scripts/ci-controls.mjs
      - name: Classify the complete event diff
        id: scope
        env:
          CI_SCOPE_FILE: ${{ runner.temp }}/ci-scope.json
        run: node .github/scripts/ci-scope.mjs
      - name: Check prose and session metadata
        if: steps.scope.outputs.full == 'false'
        env:
          CI_SCOPE_FILE: ${{ runner.temp }}/ci-scope.json
        run: |
          node tools/check-session.mjs
          node .github/scripts/ci-docs.mjs

      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.full == 'true'
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.full == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install local backup fixture dependency
        if: steps.scope.outputs.full == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone --config /dev/null version

      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.full == 'true'

      # Fail when the manifest asks for a wildcard state grant or the real map, so every
      # state domain the mod reads stays listed by name.
      - run: node tools/check-grants.mjs
        if: steps.scope.outputs.full == 'true'

      # typecheck, then test, then confirm the committed plugin.js is a current build of
      # the source. That last one is the check nothing else in the chain can make: the
      # catalogue's SHA-256 is taken FROM plugin.js, so a stale artefact verifies
      # perfectly and is the file players run.
      - run: pnpm verify
        if: steps.scope.outputs.full == 'true'
        env:
          CI: '1'
