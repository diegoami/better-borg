# Mandos (diegoami/mandos) - a fork of neostryder's borg mod. Issues about
# THIS mod's play belong here. The game and its mod system are upstream's:
# those links route there. (The inherited file pointed at upstream's
# Discord and contact address; those belong to their mod, not this fork.)
blank_issues_enabled: true

contact_links:
  - name: The mod would not install, or two mods disagree
    url: https://github.com/neostryder/neo-angband/issues/new?template=3-mods.yml
    about: >-
      That is the mod system rather than this mod. File it against the game and
      it reaches the code that can fix it.

  - name: The game itself does not match Angband 4.2.6
    url: https://github.com/neostryder/neo-angband/issues/new?template=1-parity-difference.yml
    about: >-
      Turn this mod off first and check it still happens - changing the game is
      what a mod is for. If it does, the game wants to hear about it.
